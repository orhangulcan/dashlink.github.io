<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashlink - App Preview & Terms</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            line-height: 1.6; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            color: #333; 
        }
        h1, h2 { color: #111; }
        .video-container {
            margin: 30px 0;
            text-align: center; /* Videoyu ortalar */
        }
        /* Otomatik Dark Mode Desteği */
        @media (prefers-color-scheme: dark) {
            body { background-color: #121212; color: #e0e0e0; }
            h1, h2 { color: #ffffff; }
        }
    </style>
</head>
<body>
    <h1>Dashlink</h1>
    
    <div class="video-container">
        <video style="max-width: 350px; width: 100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);" controls>
            <source src="dashlink_screen_record.mp4" type="video/mp4">
            Tarayıcınız video oynatmayı desteklemiyor.
        </video>
    </div>
</body>
</html>
